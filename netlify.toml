[build]
publish = "dist"
command = "pnpm run build"

[build.environment]
NODE_VERSION = "20"

# 将 /posts/foo 映射到 posts/foo.html，避免 fallback 到首页
[build.processing.html]
pretty_urls = true

[[headers]]
for = "/index.html"

[headers.values]
Cache-Control = "no-cache"

[[headers]]
for = "/posts/*"

[headers.values]
Cache-Control = "no-cache"

[[headers]]
for = "/manifest.webmanifest"

[headers.values]
Content-Type = "application/manifest+json"
